plugins {
    id 'com.gradleup.shadow'
    id "at.petra-k.pkpcpbp.PKJson5Plugin"
    id "org.jetbrains.kotlin.jvm"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}


configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://files.minecraftforge.net/maven/' }
    maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
    maven { url = "https://maven.blamejared.com/" }
    maven { url = "https://maven.ladysnake.org/releases" }
    maven { url = "https://maven.terraformersmc.com/"}
    maven { url = "https://maven.theillusivec4.top/"}
    maven { url = "https://maven.parchmentmc.org" }
    maven { url = 'https://maven.wispforest.io/releases' }
    maven { url = "https://maven.sinytra.org/" }
    flatDir {
        dirs '../libs'
    }
}
kotlin {
    jvmToolchain(21)
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')


    // Common
    implementation("vazkii.patchouli:Patchouli:$minecraft_version-$patchouli_version-NEOFORGE")
    implementation("at.petra-k.hexcasting:hexcasting-neoforge-$minecraft_version:$hexcasting_version")
    implementation("at.petra-k:paucal:$paucal_version+$minecraft_version-neoforge")
    implementation("com.samsthenerd.inline:inline-neoforge:$minecraft_version-$inline_version")
    implementation("dev.architectury:architectury-neoforge:$architectury_api_version")
    implementation("io.wispforest:accessories-neoforge:$accessories_version+$minecraft_version")

    // NeoForge
    implementation("thedarkcolour:kotlinforforge-neoforge:$kotlin_neoforge")
    runtimeOnly("com.illusivesoulworks.caelus:caelus-neoforge:$caelus_version+$minecraft_version")
    compileOnly("com.illusivesoulworks.caelus:caelus-neoforge:$caelus_version+$minecraft_version:api")
}

processResources {
    //inputs.property 'version', project.version
    def buildProps = project.properties.clone()
    filesMatching('META-INF/neoforge.mods.toml') {
        expand buildProps
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}


