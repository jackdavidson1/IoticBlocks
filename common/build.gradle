plugins {
    id "at.petra-k.pkpcpbp.PKJson5Plugin"
}

architectury {
    common rootProject.enabled_platforms.split(',')
}
repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://files.minecraftforge.net/maven/' }
        maven { url = 'https://thedarkcolour.github.io/KotlinForForge/' }
        maven { url = "https://maven.blamejared.com/" }
        maven { url = "https://maven.ladysnake.org/releases" }
        maven { url = "https://maven.terraformersmc.com/"}
        maven { url = "https://maven.parchmentmc.org" }
        maven { url = 'https://maven.wispforest.io/releases' }
        maven { url = "https://maven.sinytra.org/" }
        flatDir {
            dirs '../libs'
        }
}

pkJson5 {
    autoProcessJson5 = true
    autoProcessJson5Flattening = true
}


processResources {
    def buildProps = project.properties.clone()

    filesMatching(['pack.mcmeta']) {
        expand buildProps
    }
}

dependencies {
    // We depend on Fabric Loader here to use the Fabric @Environment annotations,
    // which get remapped to the correct annotations on each platform.
    // Do NOT use other classes from Fabric Loader.
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"

    // Architectury API. This is optional, and you can comment it out if you don't need it.
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    implementation "at.petra-k.hexcasting:hexcasting-neoforge-$minecraft_version:$hexcasting_version"
    implementation "at.petra-k:paucal:$paucal_version+$minecraft_version-common"
    implementation "com.samsthenerd.inline:inline-common:$minecraft_version-$inline_version"
    implementation("io.wispforest:accessories-common:$accessories_version+$minecraft_version")
}
